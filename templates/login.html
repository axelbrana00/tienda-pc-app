{% extends "base.html" %}
{% block titulo %}Ingresar{% endblock %}
{% block contenido %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h2 class="mb-3">Ingresar</h2>
    {% with mensajes = get_flashed_messages(with_categories=true) %}
      {% for categoria, mensaje in mensajes %}
        <div class="alert alert-{{ categoria }}">{{ mensaje }}</div>
      {% endfor %}
    {% endwith %}
    <form method="post">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary">Ingresar</button>
      <a href="{{ url_for('registro') }}" class="btn btn-link">Crear cuenta</a>
    </form>
        <hr>
    <a href="{{ url_for('login_google') }}" class="btn btn-outline-dark w-100">Ingresar con Google</a>
  </div>
</div>
{% endblock %}
