<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Tienda PC{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/">Tienda PC</a>
      <ul class="navbar-nav ms-auto flex-row gap-3">
        {% if dolar %}
          <li class="nav-item"><span class="navbar-text">Dólar oficial: ${{ dolar.venta }}</span></li>
        {% endif %}
        {% if current_user.is_authenticated %}
          <li class="nav-item"><a class="nav-link" href="{{ url_for('componentes') }}">Componentes</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('proveedores.listado') }}">Proveedores</a></li>
          <li class="nav-item"><span class="navbar-text">{{ current_user.nombre }}</span></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('logout') }}">Salir</a></li>
        {% else %}
          <li class="nav-item"><a class="nav-link" href="{{ url_for('login') }}">Ingresar</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('registro') }}">Registrarme</a></li>
        {% endif %}
      </ul>
    </div>
  </nav>
  <main class="container my-4">
    {% block contenido %}{% endblock %}
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
