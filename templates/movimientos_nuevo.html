{% extends "base.html" %}
{% block titulo %}Registrar movimiento{% endblock %}
{% block contenido %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h2 class="mb-3">Registrar movimiento</h2>
    {% with mensajes = get_flashed_messages(with_categories=true) %}
      {% for categoria, mensaje in mensajes %}
        <div class="alert alert-{{ categoria }}">{{ mensaje }}</div>
      {% endfor %}
    {% endwith %}
    <form method="post">
      <div class="mb-3">
        <label class="form-label">Componente</label>
        <select name="componente_id" class="form-select" required>
          {% for c in componentes %}
            <option value="{{ c.id }}">{{ c.nombre }} (stock: {{ c.stock }})</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Tipo</label>
        <select name="tipo" class="form-select" required>
          <option value="entrada">Entrada (ingresa mercadería)</option>
          <option value="salida">Salida (se vende o se retira)</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Cantidad</label>
        <input type="number" name="cantidad" min="1" value="1" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Registrar</button>
      <a href="{{ url_for('movimientos.listado') }}" class="btn btn-link">Cancelar</a>
    </form>
  </div>
</div>
{% endblock %}
