{% extends "base.html" %}
{% block titulo %}Nuevo proveedor{% endblock %}
{% block contenido %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h2 class="mb-3">Nuevo proveedor</h2>
    {% with mensajes = get_flashed_messages(with_categories=true) %}
      {% for categoria, mensaje in mensajes %}
        <div class="alert alert-{{ categoria }}">{{ mensaje }}</div>
      {% endfor %}
    {% endwith %}
    <form method="post">
      <div class="mb-3">
        <label class="form-label">Nombre</label>
        <input type="text" name="nombre" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Contacto (email o teléfono)</label>
        <input type="text" name="contacto" class="form-control">
      </div>
      <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Guardar</button>
      <a href="{{ url_for('proveedores.listado') }}" class="btn btn-link">Cancelar</a>
    </form>
  </div>
</div>
{% endblock %}
